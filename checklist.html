<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist — Troca de Veículo CNH PE</title>
<style>
:root{
  --teal:#1B6B5E;--teal-dk:#134F46;--teal-lt:#EBF7F4;
  --green:#276749;--green-lt:#EBF7F0;--green-bd:#6FCF97;
  --red:#C53030;--red-lt:#FFF5F5;
  --amber:#856404;--amber-lt:#FFFBF0;--amber-bd:#FFD700;
  --ink:#1A202C;--ink-soft:#718096;
  --bg:#F7FAFC;--white:#fff;--line:#E2E8F0;
  --r:10px;--sh:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.wrap{max-width:680px;margin:0 auto;padding:12px 14px}

.hd{background:var(--teal);color:#fff;padding:14px 18px;border-radius:var(--r);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:16px;font-weight:700}
.hd p{font-size:12px;opacity:.8;margin-top:2px}

.tabs{display:flex;gap:6px;background:var(--white);border-radius:var(--r);padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.tab{flex:1;padding:8px 4px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:none;color:var(--ink-soft)}
.tab.on{background:var(--teal);color:#fff}

.card{background:var(--white);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ctitle{font-size:13.5px;font-weight:700;color:var(--teal);margin-bottom:12px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:480px){.g2,.g3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);background:var(--white);font-family:inherit}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--teal)}
.f textarea{resize:vertical;min-height:72px}

.sh{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sh::after{content:'';flex:1;height:1px;background:var(--line)}

/* Checklist rows */
.ci{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);margin-bottom:6px;background:var(--white)}
.ci.ok{border-color:var(--green-bd);background:var(--green-lt)}
.ci.nok{border-color:#FC8181;background:var(--red-lt)}
.ci.na{border-color:var(--amber-bd);background:var(--amber-lt)}
.ci-name{flex:1;font-size:13px}
.opts{display:flex;gap:4px}
.opts label{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;cursor:pointer;padding:3px 8px;border-radius:6px;border:1.5px solid var(--line);white-space:nowrap;user-select:none}
.opts input[type=radio]{display:none}
.opts label.sel-ok{background:var(--green);border-color:var(--green);color:#fff}
.opts label.sel-nok{background:var(--red);border-color:var(--red);color:#fff}
.opts label.sel-na{background:var(--amber);border-color:var(--amber);color:#fff}

/* Fuel */
.fuel{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.fseg{width:30px;height:20px;border-radius:4px;border:2px solid var(--line);cursor:pointer;transition:all .1s}
.fseg.on{background:var(--green);border-color:var(--green)}

/* Signature */
.sig-box{border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;height:100px;cursor:crosshair;touch-action:none;background:#fff}
.sig-toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.sig-toolbar span{flex:1;font-size:11.5px;color:var(--ink-soft)}

/* Buttons */
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--teal);color:#fff;width:100%;padding:13px}
.btn-g{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn-del{background:var(--red);color:#fff;font-size:12px;padding:5px 12px}

/* List */
.row{background:var(--white);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;border:1.5px solid transparent}
.row:hover{border-color:var(--teal)}
.row-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-s{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-ok{background:var(--green-lt);color:var(--green)}
.b-nok{background:var(--red-lt);color:var(--red)}
.b-pend{background:var(--amber-lt);color:var(--amber)}

/* View */
.vi{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;margin-bottom:5px;background:var(--bg)}
.vi-n{flex:1;font-size:13px}
.v-ok{color:var(--green);font-weight:700;font-size:12px}
.v-nok{color:var(--red);font-weight:700;font-size:12px}
.v-na{color:var(--amber);font-weight:700;font-size:12px}
.info-row{display:flex;gap:6px;flex-direction:column;font-size:13px}
.info-row .kv{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.info-row .kv:last-child{border:none}
.info-row .kv span:first-child{color:var(--ink-soft);font-size:12px;min-width:120px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#1A202C;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:9999;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:50px;color:var(--ink-soft)}
.empty{text-align:center;padding:50px;color:var(--ink-soft)}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9998;padding:14px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:#fff;border:none;border-radius:999px;width:36px;height:36px;font-size:18px;font-weight:700;cursor:pointer}
.banner{background:var(--amber-lt);border:1.5px solid var(--amber-bd);color:var(--amber);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto;background:none;border:1px solid var(--amber);color:var(--amber);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.thumb{position:relative;display:inline-block}
.thumb img{width:92px;height:72px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line);cursor:pointer}
.thumb .x{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer}
.btn-foto{background:#f0f4ff;border:1px solid #9ab0e0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:#3355aa;cursor:pointer}
.hide-file{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">⏳ Carregando…</div></div>
<div class="lb" id="lb" onclick="if(event.target===this)closeLB()"></div>
<div class="toast" id="toast"></div>

<script>
/* ── Supabase config ─────────────────────────────────────────── */
var SB_URL = 'https://dvypppchbsntnhnqttdq.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eXBwcGNoYnNudG5obnF0dGRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTgzNDcsImV4cCI6MjA5ODQ3NDM0N30.QFjjTM8-g6w-nf_zuuEEn8bOo00l-ZBt6wlP5PxpfHE';
var DB_KEY = 'checklists-troca';
var DRAFT_KEY = 'ck_rascunho_v1';          // rascunho de checklist NOVO
var DRAFT_EDIT_KEY = 'ck_rascunho_edit_v1'; // rascunho de uma EDIÇÃO
var MEUS_KEY = 'ck_meus_v1';               // ids que ESTE aparelho preencheu (podem ser editados aqui)
var MAX_FOTOS = 4;

/* ── Dados de domínio ────────────────────────────────────────── */
var CIDADES = ['Recife','Caruaru','Garanhuns','Petrolina','Arcoverde',
  'Afogados da Ingazeira','Belo Jardim','Pesqueira','Araripina','Ouricuri',
  'Salgueiro','Serra Talhada','Vitória de Santo Antão','Timbaúba',
  'Limoeiro','Palmares','Surubim','Sta Cruz do Capibaribe'];

var ITENS = [
  {id:'cam_f',  g:'equip', l:'📷 Câmera frontal'},
  {id:'cam_l',  g:'equip', l:'📷 Câmera lateral'},
  {id:'cam_i',  g:'equip', l:'📷 Câmera interna'},
  {id:'cam_t',  g:'equip', l:'📷 Câmera traseira'},
  {id:'biom',   g:'equip', l:'👆 Leitor biométrico'},
  {id:'case',   g:'equip', l:'💼 Case (equipamentos)'},
  {id:'chrod',  g:'seg',   l:'🔧 Chave de roda'},
  {id:'mac',    g:'seg',   l:'🔩 Macaco'},
  {id:'tri',    g:'seg',   l:'⚠️ Triângulo'},
  {id:'est',    g:'seg',   l:'🛞 Estepe'},
  {id:'crlv',   g:'seg',   l:'📋 CRLV (documento)'},
  {id:'cartao',  g:'seg',   l:'💳 Cartão de abastecimento'},
  {id:'taco',   g:'cde',   l:'🕐 Tacógrafo'},
  {id:'pneus',  g:'cond',  l:'🛞 Pneus (estado geral)'},
  {id:'vidros', g:'cond',  l:'🪟 Vidros / Retrovisores'},
  {id:'lint',   g:'cond',  l:'🧹 Limpeza interna'},
  {id:'lext',   g:'cond',  l:'🚗 Limpeza externa'},
  {id:'avar',   g:'cond',  l:'🔍 Avarias visíveis'},
];
var MOTIVOS = ['Substituição planejada','Problema mecânico','Sinistro / Acidente','Apoio operacional','Outro'];
var CATS    = ['B','C','D','E'];



/* ── Estado local ────────────────────────────────────────────── */
var checklists = [];
var frota = [];                // veículos da frota (para busca)
var view = 'list';             // list | new | edit | detail
var editId = null;             // id do checklist em edição
var detalheFotos = [];
var sigC, sigDraw = false, sigLx = 0, sigLy = 0, sigOk = false;
var itensState = {};
var fuelVal = 0;
var fotosCapturadas = [];      // fotos NOVAS (dataURL)
var fotosExistentes = [];      // edição: fotos já gravadas [{key, data}] (key null = foto de registro antigo)
var fotosRemovidas = [];       // edição: chaves de fotos que o usuário tirou
var salvando = false;
var snapTimer = null;
var FIELD_IDS = ['fi-data','fi-cat','fi-placa','fi-op','fi-cartao','fi-orig','fi-dest','fi-cid','fi-mot','fi-mot-nome','fi-obs','fi-resp'];

/* ── Supabase REST ───────────────────────────────────────────── */
/* sbGetRaw distingue "não existe" (ok:true,value:null) de "falhou" (ok:false) —
   assim nunca regravamos a lista por cima achando que estava vazia. */
function sbGetRaw(key) {
  return new Promise(function(res) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', SB_URL+'/rest/v1/kv_store?key=eq.'+encodeURIComponent(key)+'&select=value&limit=1', true);
    xhr.setRequestHeader('apikey', SB_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer '+SB_KEY);
    xhr.timeout = 30000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { var d = JSON.parse(xhr.responseText); res({ok:true, value:(d && d[0]) ? d[0].value : null}); }
        catch(_) { res({ok:false, value:null}); }
      } else { res({ok:false, value:null}); }
    };
    xhr.onerror = xhr.ontimeout = function() { res({ok:false, value:null}); };
    xhr.send();
  });
}
function sbSet(key, value) {
  return new Promise(function(res) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', SB_URL+'/rest/v1/kv_store', true);
    xhr.setRequestHeader('apikey', SB_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer '+SB_KEY);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Prefer', 'resolution=merge-duplicates');
    xhr.timeout = 30000;
    xhr.onload = function() { res({ok: xhr.status >= 200 && xhr.status < 300}); };
    xhr.onerror = xhr.ontimeout = function() { res({ok: false}); };
    xhr.send(JSON.stringify({key: key, value: value}));
  });
}

/* ── "Meus checklists": quem preencheu neste aparelho pode editar ─ */
function meusIds() { try { return JSON.parse(localStorage.getItem(MEUS_KEY) || '[]'); } catch(_) { return []; } }
function addMeu(id) { var a = meusIds(); if (a.indexOf(id) < 0) { a.push(id); try { localStorage.setItem(MEUS_KEY, JSON.stringify(a.slice(-300))); } catch(_) {} } }
function ehMeu(id) { return meusIds().indexOf(id) >= 0; }
function achar(id) { for (var i = 0; i < checklists.length; i++) { if (checklists[i].id === id) return checklists[i]; } return null; }

/* ── Rascunho (sobrevive à câmera / recarga da página) ───────── */
function draftKey() { return editId ? DRAFT_EDIT_KEY : DRAFT_KEY; }
function readDraftK(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(_) { return null; } }
function writeDraftK(k, o) { try { localStorage.setItem(k, JSON.stringify(o)); return true; } catch(_) { return false; } }
function clearDraftK(k) { try { localStorage.removeItem(k); } catch(_) {} }
function snapshotDraft() {
  if (view !== 'new' && view !== 'edit') return;
  var d = {aberto:true, editId:editId, campos:{}, itens:itensState, fuel:fuelVal, fotos:fotosCapturadas, removidas:fotosRemovidas, t:Date.now()};
  FIELD_IDS.forEach(function(id) { var el = document.getElementById(id); if (el) d.campos[id] = el.value; });
  var k = draftKey();
  if (!writeDraftK(k, d)) { d.fotos = []; writeDraftK(k, d); }   // sem espaço: guarda ao menos os campos
}
function schedSnap() { clearTimeout(snapTimer); snapTimer = setTimeout(snapshotDraft, 250); }
function restoreDraft(d) {
  FIELD_IDS.forEach(function(id) { var el = document.getElementById(id); if (el && d.campos && d.campos[id] !== undefined) el.value = d.campos[id]; });
  updCDE();
  itensState = {};
  Object.keys(d.itens || {}).forEach(function(k) { itensState[k] = d.itens[k]; applyItemVisual(k, d.itens[k]); });
  if (d.fuel) setFuelVisual(d.fuel);
  fotosCapturadas = (d.fotos || []).slice();
  fotosRemovidas = (d.removidas || []).slice();
  updateFotoPreview();
}
function descartarRascunho() {
  if (!confirm(editId ? 'Descartar as alterações e voltar aos dados salvos?' : 'Descartar o rascunho e começar um checklist em branco?')) return;
  clearDraftK(draftKey()); fotosCapturadas = []; fotosRemovidas = []; itensState = {}; fuelVal = 0;
  if (editId) startEdit(editId, true); else showNew();
}
function voltarLista() {
  var k = draftKey(), d = readDraftK(k); if (d) { d.aberto = false; writeDraftK(k, d); }
  var estavaEditando = editId; editId = null;
  if (estavaEditando && achar(estavaEditando)) showDetailId(estavaEditando); else renderList();
}

/* ── Init ────────────────────────────────────────────────────── */
async function init() {
  var app = document.getElementById('app');
  app.addEventListener('input', function(ev) { if (ev.target && ev.target.id === 'fi-busca') aplicarVeiculoBusca(); schedSnap(); });
  app.addEventListener('change', function(ev) { if (ev.target && ev.target.id === 'fi-busca') aplicarVeiculoBusca(); schedSnap(); });
  var r = await sbGetRaw(DB_KEY);
  if (r.ok) { try { checklists = r.value ? JSON.parse(r.value) : []; } catch(_) { checklists = []; } }
  var de = readDraftK(DRAFT_EDIT_KEY), dn = readDraftK(DRAFT_KEY);
  if (de && de.aberto && de.editId && achar(de.editId) && ehMeu(de.editId)) { startEdit(de.editId); }
  else if (dn && dn.aberto) { showNew(); }
  else { renderList(); }
  if (!r.ok) toast('⚠️ Sem conexão com o banco. A lista pode estar incompleta.');
  carregarFrota();
}
async function reloadList() {
  toast('🔄 Atualizando…');
  var r = await sbGetRaw(DB_KEY);
  if (!r.ok) { toast('❌ Sem conexão. Tente de novo.'); return; }
  try { checklists = r.value ? JSON.parse(r.value) : []; } catch(_) { checklists = []; }
  renderList(); toast('✅ Lista atualizada.');
}

/* ── Frota: busca de veículo (preenche placa, nº de ordem, cartão, categoria) ─ */
function parseNomeVeic(nome) {
  var m = /^\s*(\d{1,3})\s*-\s*(.+?)\s*$/.exec(nome || '');
  return m ? {op:m[1], placa:m[2]} : {op:'', placa:String(nome || '').trim()};
}
function rotuloVeic(v) { return (v.op ? v.op+' · ' : '')+v.placa+' · '+v.cidade+(v.cat ? ' (Cat. '+v.cat+')' : ''); }
async function carregarFrota() {
  var r = await sbGetRaw('veiculos-lista');
  if (r.ok && r.value) {
    try {
      frota = (JSON.parse(r.value) || []).filter(function(v){ return v && v.nome && v.ativo !== false; }).map(function(v) {
        var p = parseNomeVeic(v.nome); return {op:p.op, placa:p.placa, cat:v.categoria || '', cidade:v.cidade || '', cartao:v.cartaoAbast || ''};
      }).sort(function(a, b) { return (parseInt(a.op,10) || 9999) - (parseInt(b.op,10) || 9999) || a.placa.localeCompare(b.placa); });
    } catch(_) { frota = []; }
  }
  preencherListaFrota();
}
function preencherListaFrota() {
  var dl = document.getElementById('dl-frota'); if (!dl) return;
  dl.innerHTML = frota.map(function(v){ return '<option value="'+e(rotuloVeic(v))+'"></option>'; }).join('');
  var h = document.getElementById('fi-busca-hint');
  if (h) h.textContent = frota.length ? frota.length+' veículos na frota — escolha um para preencher automaticamente' : 'Lista da frota indisponível: preencha os dados à mão.';
}
function aplicarVeiculoBusca() {
  var inp = document.getElementById('fi-busca'); if (!inp) return;
  var v = null; for (var i = 0; i < frota.length; i++) { if (rotuloVeic(frota[i]) === inp.value) { v = frota[i]; break; } }
  if (!v) return;
  /* identificação do veículo SEMPRE sobrescreve (mesmo vazia): nunca deixar nº de ordem/cartão do veículo anterior */
  var set = function(id, val) { var el = document.getElementById(id); if (el) el.value = val || ''; };
  set('fi-placa', v.placa); set('fi-op', v.op); set('fi-cartao', v.cartao);
  var cat = document.getElementById('fi-cat');
  if (cat && v.cat) { for (var k = 0; k < cat.options.length; k++) { if (cat.options[k].value === v.cat) { cat.value = v.cat; break; } } }
  updCDE(); toast('✅ Dados do veículo preenchidos.'); snapshotDraft();
}

/* ── LISTA ───────────────────────────────────────────────────── */
function renderList() {
  view = 'list'; editId = null;
  var rows = checklists.length
    ? checklists.slice().reverse().map(function(c) {
        var nokCount = Object.values(c.itens||{}).filter(function(v){return v==='nok';}).length;
        var badge = nokCount > 0 ? '<span class="badge b-nok">⚠️ '+nokCount+' NOK</span>' : '<span class="badge b-ok">✅ OK</span>';
        var nF = (c.fotoIds && c.fotoIds.length) || (c.fotos && c.fotos.length) || 0;
        return '<div class="row" onclick="showDetailId(\''+e(c.id)+'\')">'
          +'<div class="row-h"><b style="font-size:14px;">🚗 '+e(c.placa)+'</b>'
          +(c.op?'<span style="font-size:12px;font-weight:700;color:var(--teal);">Nº '+e(c.op)+'</span>':'')
          +'<span style="font-size:13px;">'+e(c.cidade)+'</span>'
          +'<span style="font-size:12px;color:var(--ink-soft);">Cat.'+e(c.cat)+'</span>'+badge
          +(nF?'<span style="font-size:12px;">📷 '+nF+'</span>':'')
          +(c.editadoEm?'<span style="font-size:11px;color:var(--amber);">✏️ editado</span>':'')
          +'<span style="font-size:11.5px;color:var(--ink-soft);margin-left:auto;">'+e(fd(c.data))+'</span></div>'
          +'<div class="row-s">'+e(c.origem)+' → '+e(c.destino)+' · 🚗 '+e(c.motorista)+' · '+e(c.responsavel)+'</div></div>';
      }).join('')
    : '<div class="empty">📋<br><br>Nenhum checklist registrado ainda.<br><small>Toque em "Novo Checklist" para começar.</small></div>';
  var temRasc = !!(readDraftK(DRAFT_KEY));
  R('<div class="hd"><div style="font-size:28px">🚗</div><div><h1>Checklist — Troca de Veículo</h1><p>CNH Pernambuco · Operações</p></div></div>'

function preencherDoRegistro(c) {
  var m = {'fi-data':c.data,'fi-cat':c.cat,'fi-placa':c.placa,'fi-op':c.op,'fi-cartao':c.cartao,'fi-orig':c.origem,'fi-dest':c.destino,'fi-cid':c.cidade,'fi-mot':c.motivo,'fi-mot-nome':c.motorista,'fi-resp':c.responsavel,'fi-obs':c.obs};
  Object.keys(m).forEach(function(id) { var el = document.getElementById(id); if (el && m[id] !== undefined && m[id] !== null) el.value = m[id]; });
  updCDE();
  Object.keys(c.itens || {}).forEach(function(k) { itensState[k] = c.itens[k]; applyItemVisual(k, c.itens[k]); });
  if (c.combustivel) setFuelVisual(parseInt(c.combustivel, 10));
}
/* fotos já gravadas: as chaves entram NA HORA (para nunca serem perdidas ao salvar); as imagens carregam em seguida */
async function carregarFotosEdicao(c) {
  var removidas = fotosRemovidas.slice();
  var lista = [];
  (c.fotoIds || []).forEach(function(k) { if (removidas.indexOf(k) < 0) lista.push({key:k, data:null}); });
  (c.fotos || []).forEach(function(f) { if (f) lista.push({key:null, data:f}); });   // formato antigo: será regravado em chave própria
  fotosExistentes = lista; updateFotoPreview();
  for (var i = 0; i < lista.length; i++) {
    if (lista[i].key && !lista[i].data) {
      var r = await sbGetRaw(lista[i].key);
      if (view !== 'edit' || editId !== c.id) return;
      if (r.ok && r.value) { lista[i].data = r.value; updateFotoPreview(); }
    }
  }
}

function renderItemGroup(group, title) {
  var rows = ITENS.filter(function(i){return i.g===group;}).map(function(item) {
    return '<div class="ci" id="ci-'+item.id+'"><span class="ci-name">'+item.l+'</span><div class="opts">'
      +'<label id="lbl-'+item.id+'-ok" onclick="setItem(\''+item.id+'\',\'ok\')">✓ OK</label>'
      +'<label id="lbl-'+item.id+'-nok" onclick="setItem(\''+item.id+'\',\'nok\')">✗ NOK</label>'
      +'<label id="lbl-'+item.id+'-na" onclick="setItem(\''+item.id+'\',\'na\')">— N/A</label></div></div>';
  }).join('');
  return '<div class="sh">'+title+'</div>'+rows;
}
function applyItemVisual(id, val) {
  var row = document.getElementById('ci-'+id); if (row) row.className = 'ci '+val;
  ['ok','nok','na'].forEach(function(v) { var l = document.getElementById('lbl-'+id+'-'+v); if (l) l.className = (v===val ? 'sel-'+v : ''); });
}
function setItem(id, val) { itensState[id] = val; applyItemVisual(id, val); snapshotDraft(); }
function updCDE() {
  var cat = (document.getElementById('fi-cat')||{}).value;
  var b = document.getElementById('cde-block'); if (b) b.style.display = ['C','D','E'].indexOf(cat) >= 0 ? 'block' : 'none';
}
function setFuelVisual(n) {
  fuelVal = n;
  for (var i=1; i<=8; i++) { var s = document.getElementById('fs'+i); if (s) s.className = 'fseg'+(i<=n?' on':''); }

}
function setFuel(n) { setFuelVisual(n); snapshotDraft(); }

/* ── Fotos ───────────────────────────────────────────────────── */
function totalFotos() { return fotosExistentes.length + fotosCapturadas.length; }
function initFotos() {
  var cam = document.getElementById('foto-cam'), gal = document.getElementById('foto-gal');
  var bc = document.getElementById('btn-foto-cam'), bg = document.getElementById('btn-foto-gal');
  if (bc && cam) bc.addEventListener('click', function(){ cam.click(); });
  if (bg && gal) bg.addEventListener('click', function(){ gal.click(); });
  [cam, gal].forEach(function(inp) {
    if (!inp) return;
    inp.addEventListener('change', function() { var f = this.files && this.files[0]; this.value = ''; if (f) addFotoFromFile(f); });
  });
}
/* Usa URL do arquivo (não lê a foto inteira como texto) e reduz antes de guardar:
   menos memória → menos chance do celular recarregar a página. */
function addFotoFromFile(file) {
  if (totalFotos() >= MAX_FOTOS) { toast('⚠️ Máximo de '+MAX_FOTOS+' fotos.'); return; }
  toast('⏳ Processando foto…');
  var U = window.URL || window.webkitURL;
  var url = U.createObjectURL(file);
  var img = new Image();
  img.onload = function() {
    try {
      var MAX = 1000, w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (w > MAX || h > MAX) { var k = MAX / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      fotosCapturadas.push(cv.toDataURL('image/jpeg', 0.6));
      updateFotoPreview(); snapshotDraft(); toast('✅ Foto adicionada ('+totalFotos()+')');
    } catch(err) { toast('❌ Não consegui processar a foto. Tente outra.'); }
    finally { try { U.revokeObjectURL(url); } catch(_) {} }
  };
  img.onerror = function() { try { U.revokeObjectURL(url); } catch(_) {} toast('❌ Foto inválida. Tente outra.'); };
  img.src = url;
}
function updateFotoPreview() {
  var prev = document.getElementById('foto-preview'), cnt = document.getElementById('foto-count');
  var n = totalFotos();
  if (cnt) cnt.textContent = n ? n+' foto(s)' : 'Nenhuma foto adicionada';
  if (!prev) return;
  var h = fotosExistentes.map(function(f, i) {
    return '<div class="thumb">'+(f.data ? '<img src="'+f.data+'" onclick="lbEx('+i+')">' : '<div style="width:92px;height:72px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);">⏳</div>')
      +'<button type="button" class="x" onclick="removeFotoEx('+i+')">✕</button></div>';
  }).join('');
  h += fotosCapturadas.map(function(f, i) {
    return '<div class="thumb"><img src="'+f+'" onclick="lbNew('+i+')"><button type="button" class="x" onclick="removeFoto('+i+')">✕</button></div>';
  }).join('');
  prev.innerHTML = h;
}
function removeFoto(i) { fotosCapturadas.splice(i, 1); updateFotoPreview(); snapshotDraft(); }
function removeFotoEx(i) {
  var f = fotosExistentes.splice(i, 1)[0];
  if (f && f.key && fotosRemovidas.indexOf(f.key) < 0) fotosRemovidas.push(f.key);
  updateFotoPreview(); snapshotDraft();
}
function lbNew(i) { openLB(fotosCapturadas[i]); }
function lbEx(i) { openLB(fotosExistentes[i] && fotosExistentes[i].data); }
function lbDet(i) { openLB(detalheFotos[i]); }
function openLB(src) {
  var lb = document.getElementById('lb'); if (!src || !lb) return;
  lb.innerHTML = '<button type="button" class="lb-x" onclick="closeLB()">✕</button><img src="'+src+'">';
  lb.className = 'lb on';
}
function closeLB() { var lb = document.getElementById('lb'); if (lb) { lb.className = 'lb'; lb.innerHTML = ''; } }

/* ── Assinatura ──────────────────────────────────────────────── */
function initSig() {
  var canvas = document.getElementById('sig'); if (!canvas) return;
  sigC = canvas.getContext('2d'); sigC.strokeStyle = '#1A202C'; sigC.lineWidth = 2.2; sigC.lineCap = 'round'; sigOk = false;
  function gp(ev) { var r = canvas.getBoundingClientRect(); var sx = canvas.width/r.width, sy = canvas.height/r.height; var src = ev.touches ? ev.touches[0] : ev; return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy}; }
  function start(ev) { sigDraw = true; var p = gp(ev); sigLx = p.x; sigLy = p.y; }
  function move(ev) { if (!sigDraw) return; var p = gp(ev); sigC.beginPath(); sigC.moveTo(sigLx, sigLy); sigC.lineTo(p.x, p.y); sigC.stroke(); sigLx = p.x; sigLy = p.y; sigOk = true; }
  function end() { sigDraw = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', end); canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', function(ev){ev.preventDefault(); start(ev);}, {passive:false});
  canvas.addEventListener('touchmove', function(ev){ev.preventDefault(); move(ev);}, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig() { if (sigC) { var c = document.getElementById('sig'); sigC.clearRect(0, 0, c.width, c.height); sigOk = false; } }

/* ── SALVAR (novo ou edição) ─────────────────────────────────── */
function lerForm() {
  var g = function(id){ return ((document.getElementById(id)||{}).value||'').trim(); };
  return {data:g('fi-data'), cat:g('fi-cat') || 'B', placa:g('fi-placa').toUpperCase(), op:g('fi-op'), cartao:g('fi-cartao'),
    origem:g('fi-orig'), destino:g('fi-dest'), cidade:g('fi-cid') || g('fi-dest'), motivo:g('fi-mot'), motorista:g('fi-mot-nome'), responsavel:g('fi-resp'), obs:g('fi-obs')};
}
async function salvar() {
  if (salvando) return;
  var f = lerForm();
  if (!f.placa)       { toast('⚠️ Informe a placa.'); return; }
  if (!f.origem)      { toast('⚠️ Selecione a cidade de origem.'); return; }
  if (!f.destino)     { toast('⚠️ Selecione a cidade de destino.'); return; }
  if (!f.motorista)   { toast('⚠️ Informe o motorista.'); return; }
  if (!f.responsavel) { toast('⚠️ Informe o responsável.'); return; }
  var sigNova = '';
  if (sigOk) { var cv = document.getElementById('sig'); if (cv) sigNova = cv.toDataURL('image/jpeg', 0.5); }
  salvando = true;
  var btn = document.getElementById('btn-salvar'), rotulo = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvando…'; }
  try {
    if (editId) await gravarEdicao(f, sigNova); else await gravarNovo(f, sigNova);
  } catch(err) {
    var m = err && err.message;
    if (m === 'sumiu') { clearDraftK(DRAFT_EDIT_KEY); editId = null; toast('❌ Este checklist foi excluído pelo administrador e não pode mais ser editado.'); setTimeout(renderList, 1200); }
    else toast('❌ Não foi possível salvar ('+(m === 'foto' ? 'envio da foto' : 'conexão')+'). Seus dados continuam aqui, tente de novo.');
  } finally {
    salvando = false;
    var b2 = document.getElementById('btn-salvar'); if (b2) { b2.disabled = false; b2.textContent = rotulo; }
  }
}
async function enviarFotos(id, prefixo, fotos) {
  var chaves = [];
  for (var i = 0; i < fotos.length; i++) {
    toast('📷 Enviando foto '+(i+1)+' de '+fotos.length+'…');
    var key = 'ckfoto-'+id+'-'+prefixo+(i+1);
    var rf = await sbSet(key, fotos[i]);
    if (!rf.ok) throw new Error('foto');
    chaves.push(key);
  }
  return chaves;
}
async function lerListaAtual() {
  var lr = await sbGetRaw(DB_KEY);
  if (!lr.ok) throw new Error('lista');
  try { return lr.value ? JSON.parse(lr.value) : []; } catch(_) { throw new Error('lista'); }
}
async function gravarNovo(f, sigNova) {
  var id = 'CK'+Date.now().toString(36).toUpperCase();
  var fotoIds = await enviarFotos(id, '', fotosCapturadas);       // cada foto em sua própria chave (lista leve)
  var doc = {id:id, data:f.data, placa:f.placa, cat:f.cat, op:f.op, cartao:f.cartao, cidade:f.cidade, origem:f.origem, destino:f.destino,
    motivo:f.motivo, motorista:f.motorista, responsavel:f.responsavel, itens:Object.assign({}, itensState), combustivel:fuelVal,
    obs:f.obs, assinatura:sigNova, fotoIds:fotoIds, criadoEm:new Date().toISOString()};
  toast('💾 Salvando…');
  var lista = await lerListaAtual();                                // versão MAIS RECENTE do banco: não apaga o de ninguém
  if (!lista.some(function(x){ return x.id === doc.id; })) lista.push(doc);
  var wr = await sbSet(DB_KEY, JSON.stringify(lista));
  if (!wr.ok) throw new Error('lista');
  addMeu(id); checklists = lista;
  clearDraftK(DRAFT_KEY); fotosCapturadas = []; itensState = {}; fuelVal = 0;
  toast('✅ Checklist salvo!');
  setTimeout(renderList, 900);
}
async function gravarEdicao(f, sigNova) {
  var id = editId;
  /* fotos: mantém as que já estavam gravadas; envia as novas (e as do formato antigo) com chaves próprias */
  var manter = fotosExistentes.filter(function(x){ return x.key; }).map(function(x){ return x.key; });
  var enviar = fotosExistentes.filter(function(x){ return !x.key && x.data; }).map(function(x){ return x.data; }).concat(fotosCapturadas);
  var novas = await enviarFotos(id, 'e'+Date.now().toString(36).toUpperCase()+'-', enviar);
  toast('💾 Salvando alterações…');
  var lista = await lerListaAtual();
  var idx = -1; for (var i = 0; i < lista.length; i++) { if (lista[i].id === id) { idx = i; break; } }
  if (idx < 0) throw new Error('sumiu');
  var antigo = lista[idx];
  var upd = Object.assign({}, antigo, {data:f.data, placa:f.placa, cat:f.cat, op:f.op, cartao:f.cartao, cidade:f.cidade, origem:f.origem, destino:f.destino,
    motivo:f.motivo, motorista:f.motorista, responsavel:f.responsavel, itens:Object.assign({}, itensState), combustivel:fuelVal, obs:f.obs,
    assinatura:sigNova || antigo.assinatura || '', fotoIds:manter.concat(novas),
    editadoEm:new Date().toISOString(), editadoPor:f.responsavel, edicoes:(antigo.edicoes || 0) + 1});
  delete upd.fotos;
  lista[idx] = upd;
  var wr = await sbSet(DB_KEY, JSON.stringify(lista));
  if (!wr.ok) throw new Error('lista');
  checklists = lista; clearDraftK(DRAFT_EDIT_KEY);
  fotosRemovidas.forEach(function(k) { sbSet(k, ''); });           // libera o espaço das fotos retiradas
  fotosCapturadas = []; fotosExistentes = []; fotosRemovidas = []; editId = null;
  toast('✅ Alterações salvas!');
  setTimeout(function(){ showDetailId(id); }, 700);
}

/* ── DETALHE ─────────────────────────────────────────────────── */
function showDetailId(id) {
  var c = achar(id);
  if (!c) { renderList(); return; }
  view = 'detail'; editId = null; detalheFotos = [];
  var nokN = Object.values(c.itens||{}).filter(function(v){return v==='nok';}).length;
  var stBadge = nokN > 0 ? '<span class="badge b-nok">⚠️ '+nokN+' item(s) NOK</span>' : '<span class="badge b-ok">✅ Todos OK</span>';
  var iHtml = ITENS.map(function(item) {
    var v = (c.itens||{})[item.id]; if (!v) return '';
    var l = v==='ok'?'<span class="v-ok">✓ OK</span>':v==='nok'?'<span class="v-nok">✗ NOK</span>':'<span class="v-na">— N/A</span>';
    return '<div class="vi"><span class="vi-n">'+item.l+'</span>'+l+'</div>';
  }).join('');
  var fuel = c.combustivel ? Math.round(c.combustivel/8*100)+'%' : '—';
  var nF = (c.fotoIds && c.fotoIds.length) || (c.fotos && c.fotos.length) || 0;
  var fotosCard = nF ? '<div class="card"><div class="ctitle">📷 Fotos ('+nF+')</div><div id="fotos-box" style="display:flex;gap:8px;flex-wrap:wrap;"><span style="font-size:12.5px;color:var(--ink-soft);">⏳ Carregando fotos…</span></div></div>' : '';
  var obsCard = c.obs ? '<div class="card"><div class="ctitle">📝 Observações</div><p style="font-size:13.5px;line-height:1.6;">'+e(c.obs)+'</p></div>' : '';
  var sigCard = c.assinatura ? '<div class="card"><div class="ctitle">✍️ Assinatura</div><img src="'+c.assinatura+'" style="max-width:100%;border-radius:8px;border:1px solid var(--line);"><p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">'+e(c.responsavel)+'</p></div>' : '';
  var podeEditar = ehMeu(c.id);
  var editInfo = c.editadoEm ? '<div class="banner" style="margin-bottom:12px;">✏️ Editado em '+e(String(c.editadoEm).replace('T',' ').slice(0,16))+' por '+e(c.editadoPor||'—')+(c.edicoes>1?' ('+c.edicoes+' edições)':'')+'</div>' : '';

  R('<div class="hd"><div style="font-size:28px">📋</div><div><h1>'+e(c.placa)+(c.op?' · Nº '+e(c.op):'')+' — Cat. '+e(c.cat)+'</h1><p>'+e(fd(c.data))+' · '+e(c.origem)+' → '+e(c.destino)+'</p></div></div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">'+stBadge+'<span style="font-size:12px;color:var(--ink-soft);">por '+e(c.responsavel)+'</span>'
    +(podeEditar?'<button type="button" class="btn btn-g" style="margin-left:auto;padding:6px 14px;" onclick="startEdit(\''+e(c.id)+'\')">✏️ Editar</button>':'')+'</div>'
    + editInfo
    +'<div class="card"><div class="ctitle">📍 Informações</div><div class="info-row">'
    +'<div class="kv"><span>Placa</span><b>'+e(c.placa)+'</b></div>'
    +'<div class="kv"><span>Nº de ordem</span><span>'+e(c.op||'—')+'</span></div>'
    +'<div class="kv"><span>Cartão de abastec.</span><span>'+e(c.cartao||'—')+'</span></div>'
    +'<div class="kv"><span>Motorista</span><span>'+e(c.motorista)+'</span></div>'
    +'<div class="kv"><span>Motivo</span><span>'+e(c.motivo)+'</span></div>'
    +'<div class="kv"><span>Combustível</span><span>'+fuel+'</span></div>'
    +'<div class="kv"><span>Responsável</span><span>'+e(c.responsavel)+'</span></div></div></div>'
    +'<div class="card"><div class="ctitle">✅ Checklist</div>'+(iHtml||'<p style="color:var(--ink-soft);font-size:13px;">Nenhum item registrado.</p>')+'</div>'
    + obsCard + fotosCard + sigCard
    +'<button type="button" class="btn" style="background:none;border:1.5px solid var(--line);width:100%;padding:12px;margin-bottom:24px;" onclick="renderList()">← Voltar à lista</button>');
  if (nF) carregarFotos(c);
}
async function carregarFotos(c) {
  var box, i;
  var fotos = [];
  if (c.fotos && c.fotos.length) fotos = c.fotos.slice();            // formato antigo (dentro do registro)
  if (c.fotoIds && c.fotoIds.length) {
    for (i = 0; i < c.fotoIds.length; i++) { var r = await sbGetRaw(c.fotoIds[i]); fotos.push(r.ok && r.value ? r.value : null); }
  }
  if (view !== 'detail') return;
  detalheFotos = fotos; box = document.getElementById('fotos-box'); if (!box) return;
  box.innerHTML = fotos.map(function(f, k) {
    return f ? '<div class="thumb"><img src="'+f+'" onclick="lbDet('+k+')"></div>'
             : '<div style="width:92px;height:72px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);text-align:center;">não carregou</div>';
  }).join('') || '<span style="font-size:12.5px;color:var(--ink-soft);">Sem fotos.</span>';
}

/* ── Helpers ─────────────────────────────────────────────────── */
function R(html) { document.getElementById('app').innerHTML = html; }
function e(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fd(s){ if(!s) return '—'; if(s.indexOf('-')>=0&&s.length>=10){var p=s.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];} return s; }
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast on'; clearTimeout(t._t); t._t = setTimeout(function(){ t.className = 'toast'; }, 3200); }

window.showNew = showNew; window.renderList = renderList; window.voltarLista = voltarLista; window.reloadList = reloadList;
window.showDetailId = showDetailId; window.startEdit = startEdit; window.salvar = salvar; window.setItem = setItem; window.updCDE = updCDE; window.setFuel = setFuel;
window.clearSig = clearSig; window.removeFoto = removeFoto; window.removeFotoEx = removeFotoEx; window.lbNew = lbNew; window.lbEx = lbEx; window.lbDet = lbDet; window.closeLB = closeLB;
window.descartarRascunho = descartarRascunho;

init();

</script>
