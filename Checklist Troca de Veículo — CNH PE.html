<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Troca de Veículo — CNH PE</title>
<style>
:root {
  --teal:#1B6B5E; --teal-lt:#EBF7F4; --teal-dk:#134F46;
  --amber:#856404; --amber-lt:#FFFBF0; --amber-bd:#FFD700;
  --red:#C53030; --red-lt:#FFF5F5;
  --green:#276749; --green-lt:#EBF7F0; --green-bd:#6FCF97;
  --line:#E2E8F0; --ink:#1A202C; --ink-soft:#718096;
  --bg:#F7FAFC; --white:#fff;
  --radius:10px; --shadow:0 2px 8px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0F1117;--white:#1A202C;--ink:#E2E8F0;--ink-soft:#A0AEC0;--line:#2D3748;--teal-lt:#1A3330;--amber-lt:#2D2100;--red-lt:#2D1515;--green-lt:#1A2D22;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
.app{max-width:700px;margin:0 auto;padding:12px 14px}

/* Header */
.header{background:var(--teal);color:#fff;padding:14px 18px;border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:700}
.header p{font-size:12px;opacity:.8;margin-top:2px}
.logo{font-size:28px}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--white);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow)}
.tab{flex:1;padding:8px 6px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;background:none;color:var(--ink-soft);transition:all .15s}
.tab.active{background:var(--teal);color:#fff}

/* Cards */
.card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* Form fields */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:500px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);background:var(--bg);font-family:inherit;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal)}
.field textarea{resize:vertical;min-height:70px}

/* Section header */
.section-hd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.section-hd::after{content:'';flex:1;height:1px;background:var(--line)}

/* Checklist items */
.cl-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);margin-bottom:6px;background:var(--white);transition:border-color .15s}
.cl-item:has(.opt-ok:checked){border-color:var(--green-bd);background:var(--green-lt)}
.cl-item:has(.opt-nok:checked){border-color:#FC8181;background:var(--red-lt)}
.cl-item:has(.opt-na:checked){border-color:var(--amber-bd);background:var(--amber-lt)}
.cl-name{flex:1;font-size:13.5px;font-weight:500}
.cl-opts{display:flex;gap:5px}
.cl-opts label{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;cursor:pointer;padding:3px 8px;border-radius:6px;border:1.5px solid var(--line);transition:all .15s;white-space:nowrap}
.cl-opts label:has(input:checked){color:#fff}
.cl-opts label:has(.opt-ok:checked){background:var(--green);border-color:var(--green)}
.cl-opts label:has(.opt-nok:checked){background:var(--red);border-color:var(--red)}
.cl-opts label:has(.opt-na:checked){background:var(--amber);border-color:var(--amber)}
.cl-opts input{display:none}

/* Fuel level */
.fuel-bar{display:flex;gap:4px;align-items:center}
.fuel-seg{width:32px;height:22px;border-radius:4px;border:2px solid var(--line);cursor:pointer;transition:all .15s}
.fuel-seg.f-sel{background:var(--green);border-color:var(--green)}
.fuel-label{font-size:12px;color:var(--ink-soft);margin-left:6px}

/* Signature */
.sig-wrap{border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.sig-canvas{display:block;width:100%;height:110px;cursor:crosshair;touch-action:none}
.sig-btns{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--line)}

/* Buttons */
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dk)}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-full{width:100%;justify-content:center;padding:12px}

/* Status badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge-ok{background:var(--green-lt);color:var(--green)}
.badge-pend{background:var(--amber-lt);color:var(--amber)}
.badge-nok{background:var(--red-lt);color:var(--red)}

/* List */
.cl-row{background:var(--white);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.cl-row:hover{border-color:var(--teal)}
.cl-row-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cl-row-sub{font-size:12px;color:var(--ink-soft);margin-top:4px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1A202C;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* View mode */
.view-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;margin-bottom:5px;background:var(--bg)}
.view-item .vi-name{flex:1;font-size:13px}
.vi-ok{color:var(--green);font-weight:700;font-size:12px}
.vi-nok{color:var(--red);font-weight:700;font-size:12px}
.vi-na{color:var(--amber);font-weight:700;font-size:12px}

.loading{text-align:center;padding:40px;color:var(--ink-soft);font-size:14px}
.empty{text-align:center;padding:40px;color:var(--ink-soft)}
.empty-ico{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">⏳ Carregando...</div>
</div>
<div class="toast" id="toast"></div>

<script>
const CIDADES = ['Recife','Caruaru','Garanhuns','Petrolina','Arcoverde','Afogados da Ingazeira',
  'Belo Jardim','Pesqueira','Araripina','Ouricuri','Salgueiro','Serra Talhada',
  'Vitória de Santo Antão','Timbaúba','Limoeiro','Palmares','Surubim','Sta Cruz do Capibaribe'];

const CATS = ['B','C','D','E'];

const ITENS_BASE = [
  {id:'cam_frontal',   label:'📷 Câmera frontal'},
  {id:'cam_lateral',   label:'📷 Câmera lateral'},
  {id:'cam_interna',   label:'📷 Câmera interna'},
  {id:'cam_traseira',  label:'📷 Câmera traseira'},
  {id:'biometrico',    label:'👆 Leitor biométrico'},
  {id:'case',          label:'💼 Case (equipamentos)'},
  {id:'chave_roda',    label:'🔧 Chave de roda'},
  {id:'macaco',        label:'🔩 Macaco'},
  {id:'triangulo',     label:'⚠️ Triângulo'},
  {id:'estepe',        label:'🛞 Estepe'},
  {id:'crlv',          label:'📋 CRLV (documento)'},
];
const ITENS_CDE = [{id:'tacografo', label:'🕐 Tacógrafo'}];
const ITENS_EXTRA = [
  {id:'pneus',         label:'🛞 Pneus (estado geral)'},
  {id:'vidros',        label:'🪟 Vidros / Retrovisores'},
  {id:'limpeza_int',   label:'🧹 Limpeza interna'},
  {id:'limpeza_ext',   label:'🚗 Limpeza externa'},
  {id:'avarias',       label:'🔍 Avarias visíveis'},
  {id:'combustivel',   label:'⛽ Nível de combustível'},
];

const MOTIVOS = ['Substituição planejada','Problema mecânico','Sinistro / Acidente','Apoio operacional','Outro'];

let db = null, user = null;
let currentView = 'list'; // 'list' | 'new' | 'view'
let checklists = [];
let viewingId = null;
let sigCanvas = null, sigCtx = null, sigDrawing = false, sigLastX = 0, sigLastY = 0, sigHasData = false;

async function init() {
  db   = await claude.use('db');
  user = await claude.use('user');
  if (!db) { render('<div class="loading">❌ Sem acesso ao banco de dados.</div>'); return; }
  loadList();
  subscribeList();
}

function subscribeList() {
  db.collection('checklists').orderBy('createdAt','desc').limit(50).onSnapshot(snap => {
    checklists = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (currentView === 'list') renderList();
  });
}

async function loadList() {
  try {
    const snap = await db.collection('checklists').orderBy('createdAt','desc').limit(50).get();
    checklists = snap.docs.map(d => ({id: d.id, ...d.data()}));
  } catch(e) { checklists = []; }
  renderList();
}

function render(html) { document.getElementById('app').innerHTML = html; }

/* ── LIST VIEW ─────────────────────────────────────────────────── */
function renderList() {
  currentView = 'list';
  const rows = checklists.length ? checklists.map(c => {
    const nok = Object.values(c.itens||{}).filter(v=>v==='nok').length;
    const badge = nok > 0
      ? `<span class="badge badge-nok">⚠️ ${nok} NOK</span>`
      : `<span class="badge badge-ok">✅ OK</span>`;
    return `<div class="cl-row" onclick="viewChecklist('${c.id}')">
      <div class="cl-row-head">
        <span style="font-weight:700;font-size:14px;">🚗 ${esc(c.placa||'—')}</span>
        <span style="font-size:13px;">${esc(c.cidade||'—')}</span>
        <span style="font-size:12px;color:var(--ink-soft);">Cat. ${esc(c.categoria||'—')}</span>
        ${badge}
        <span style="font-size:12px;color:var(--ink-soft);margin-left:auto;">${esc(fmtDate(c.data||c.createdAt||''))}</span>
      </div>
      <div class="cl-row-sub">
        ${esc(c.cidadeOrigem||'—')} → ${esc(c.cidadeDestino||'—')}
        &nbsp;·&nbsp; 🚗 ${esc(c.motorista||'—')}
        &nbsp;·&nbsp; por ${esc(c.responsavel||'—')}
      </div>
    </div>`;
  }).join('') : '<div class="empty"><div class="empty-ico">📋</div>Nenhum checklist registrado ainda.</div>';

  render(`
    <div class="header">
      <div class="logo">🚗</div>
      <div><h1>Checklist Troca de Veículo</h1><p>CNH Pernambuco — Operações</p></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-size:13px;color:var(--ink-soft);">${checklists.length} registro(s)</div>
      <button class="btn btn-primary" onclick="showNew()">✚ Novo Checklist</button>
    </div>
    ${rows}
  `);
}

/* ── NEW FORM ──────────────────────────────────────────────────── */
function showNew() {
  currentView = 'new';
  const today = new Date().toLocaleDateString('pt-BR');
  const todayISO = new Date().toISOString().slice(0,10);

  const cidOpts = CIDADES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const catOpts = CATS.map(c => `<option value="${c}">Categoria ${c}</option>`).join('');
  const motOpts = MOTIVOS.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');

  // Checklist items (base + extra — CDE added dynamically)
  const itensBase = ITENS_BASE.map(i => clItemHtml(i)).join('');
  const itensExtra = ITENS_EXTRA.map(i => clItemHtml(i)).join('');

  render(`
    <div class="header">
      <div class="logo">📋</div>
      <div><h1>Novo Checklist</h1><p>Troca / Transferência de Veículo</p></div>
    </div>

    <div class="card">
      <div class="card-title">📍 Informações da operação</div>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="field">
          <label>Data</label>
          <input type="date" id="f-data" value="${todayISO}" required>
        </div>
        <div class="field">
          <label>Categoria</label>
          <select id="f-cat" onchange="updateCDEItems()">${catOpts}</select>
        </div>
      </div>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="field">
          <label>Placa do veículo</label>
          <input type="text" id="f-placa" placeholder="AAA-0000" style="text-transform:uppercase">
        </div>
        <div class="field">
          <label>Número de operação</label>
          <input type="text" id="f-op" placeholder="Ex: 06">
        </div>
      </div>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="field">
          <label>Cidade de origem</label>
          <select id="f-origem"><option value="">Selecione…</option>${cidOpts}</select>
        </div>
        <div class="field">
          <label>Cidade de destino</label>
          <select id="f-destino"><option value="">Selecione…</option>${cidOpts}</select>
        </div>
      </div>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="field">
          <label>Cidade da operação</label>
          <select id="f-cidade"><option value="">Selecione…</option>${cidOpts}</select>
        </div>
        <div class="field">
          <label>Motivo da troca</label>
          <select id="f-motivo">${motOpts}</select>
        </div>
      </div>
      <div class="field">
        <label>Motorista responsável</label>
        <input type="text" id="f-motorista" placeholder="Nome completo do motorista">
      </div>
    </div>

    <div class="card">
      <div class="card-title">✅ Checklist de equipamentos</div>
      <div class="section-hd">📹 Câmeras e equipamentos</div>
      ${itensBase}
      <div id="cde-items" style="display:none;">
        <div class="section-hd">🕐 Específico Cat. C/D/E</div>
        ${ITENS_CDE.map(i => clItemHtml(i)).join('')}
      </div>
      <div class="section-hd">🚗 Condições do veículo</div>
      ${itensExtra}

      <div class="section-hd">⛽ Nível de combustível</div>
      <div class="fuel-bar" id="fuel-bar">
        ${[1,2,3,4,5,6,7,8].map(n =>
          `<div class="fuel-seg" data-n="${n}" onclick="setFuel(${n})" title="${n*12.5}%"></div>`
        ).join('')}
        <span class="fuel-label" id="fuel-lbl">— não informado</span>
        <input type="hidden" id="f-combustivel" value="">
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 Observações</div>
      <div class="field">
        <textarea id="f-obs" placeholder="Descreva avarias, problemas encontrados, itens faltantes ou qualquer observação relevante…"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">✍️ Assinatura do responsável</div>
      <div class="field" style="margin-bottom:10px;">
        <label>Nome do responsável (líder / auxiliar)</label>
        <input type="text" id="f-responsavel" placeholder="Seu nome completo">
      </div>
      <div class="sig-wrap">
        <canvas class="sig-canvas" id="sig-canvas" width="650" height="110"></canvas>
        <div class="sig-btns">
          <span style="font-size:12px;color:var(--ink-soft);flex:1;">Assine acima com o dedo ou mouse</span>
          <button class="btn btn-ghost" style="font-size:12px;padding:5px 12px;" onclick="clearSig()">🗑 Limpar</button>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:20px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="renderList()">← Voltar</button>
      <button class="btn btn-primary" style="flex:2;" onclick="salvarChecklist()">💾 Salvar Checklist</button>
    </div>
  `);

  initSig();
  updateCDEItems();
}

function clItemHtml(item) {
  return `<div class="cl-item">
    <span class="cl-name">${item.label}</span>
    <div class="cl-opts">
      <label><input type="radio" name="cl-${item.id}" value="ok"  class="opt-ok" >✓ OK</label>
      <label><input type="radio" name="cl-${item.id}" value="nok" class="opt-nok">✗ NOK</label>
      <label><input type="radio" name="cl-${item.id}" value="na"  class="opt-na" >— N/A</label>
    </div>
  </div>`;
}

function updateCDEItems() {
  const cat = document.getElementById('f-cat')?.value || 'B';
  const cde = document.getElementById('cde-items');
  if (cde) cde.style.display = ['C','D','E'].includes(cat) ? 'block' : 'none';
}

function setFuel(n) {
  document.querySelectorAll('.fuel-seg').forEach(s => {
    s.classList.toggle('f-sel', parseInt(s.dataset.n) <= n);
  });
  document.getElementById('f-combustivel').value = n;
  const pct = Math.round(n / 8 * 100);
  document.getElementById('fuel-lbl').textContent = pct + '%';
}

/* Signature canvas */
function initSig() {
  sigCanvas = document.getElementById('sig-canvas');
  if (!sigCanvas) return;
  sigCtx = sigCanvas.getContext('2d');
  sigCtx.strokeStyle = '#1A202C';
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigHasData = false;

  function getPos(e) {
    const r = sigCanvas.getBoundingClientRect();
    const scaleX = sigCanvas.width / r.width;
    const scaleY = sigCanvas.height / r.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * scaleX, y: (src.clientY - r.top) * scaleY };
  }
  sigCanvas.addEventListener('mousedown',  e => { sigDrawing=true; const p=getPos(e); sigLastX=p.x; sigLastY=p.y; });
  sigCanvas.addEventListener('mousemove',  e => { if(!sigDrawing) return; draw(getPos(e)); });
  sigCanvas.addEventListener('mouseup',    () => sigDrawing=false);
  sigCanvas.addEventListener('mouseleave', () => sigDrawing=false);
  sigCanvas.addEventListener('touchstart', e => { e.preventDefault(); sigDrawing=true; const p=getPos(e); sigLastX=p.x; sigLastY=p.y; }, {passive:false});
  sigCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if(!sigDrawing) return; draw(getPos(e)); }, {passive:false});
  sigCanvas.addEventListener('touchend',   () => sigDrawing=false);
}

function draw(p) {
  sigCtx.beginPath();
  sigCtx.moveTo(sigLastX, sigLastY);
  sigCtx.lineTo(p.x, p.y);
  sigCtx.stroke();
  sigLastX=p.x; sigLastY=p.y;
  sigHasData = true;
}

function clearSig() {
  if (sigCtx) sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
  sigHasData = false;
}

/* ── SAVE ──────────────────────────────────────────────────────── */
async function salvarChecklist() {
  const placa     = (document.getElementById('f-placa')?.value||'').trim().toUpperCase();
  const motorista = (document.getElementById('f-motorista')?.value||'').trim();
  const resp      = (document.getElementById('f-responsavel')?.value||'').trim();
  const data      = document.getElementById('f-data')?.value || '';
  const origem    = document.getElementById('f-origem')?.value || '';
  const destino   = document.getElementById('f-destino')?.value || '';
  const cidade    = document.getElementById('f-cidade')?.value || '';
  const cat       = document.getElementById('f-cat')?.value || 'B';

  if (!placa)     { toast('⚠️ Informe a placa do veículo.'); return; }
  if (!origem)    { toast('⚠️ Selecione a cidade de origem.'); return; }
  if (!destino)   { toast('⚠️ Selecione a cidade de destino.'); return; }
  if (!motorista) { toast('⚠️ Informe o nome do motorista.'); return; }
  if (!resp)      { toast('⚠️ Informe o responsável (quem está preenchendo).'); return; }

  // Collect checklist items
  const todosItens = [...ITENS_BASE, ...ITENS_CDE, ...ITENS_EXTRA];
  const itens = {};
  todosItens.forEach(item => {
    const checked = document.querySelector(`input[name="cl-${item.id}"]:checked`);
    if (checked) itens[item.id] = checked.value;
  });

  // Signature as base64
  let assinatura = '';
  if (sigHasData && sigCanvas) assinatura = sigCanvas.toDataURL('image/png', 0.5);

  const doc = {
    placa, motorista, responsavel: resp,
    data, cidade: cidade || destino,
    cidadeOrigem: origem, cidadeDestino: destino,
    categoria: cat,
    op: (document.getElementById('f-op')?.value||'').trim(),
    motivo: document.getElementById('f-motivo')?.value || '',
    itens,
    combustivel: document.getElementById('f-combustivel')?.value || '',
    obs: (document.getElementById('f-obs')?.value||'').trim(),
    assinatura,
    createdAt: new Date().toISOString(),
    status: 'concluido',
  };

  try {
    toast('💾 Salvando...');
    const ref = db.collection('checklists').doc();
    await ref.set(doc);
    toast('✅ Checklist salvo com sucesso!');
    setTimeout(() => renderList(), 1200);
  } catch(e) {
    toast('❌ Erro ao salvar: ' + e.message);
  }
}

/* ── VIEW CHECKLIST ─────────────────────────────────────────────── */
async function viewChecklist(id) {
  currentView = 'view';
  viewingId = id;
  const c = checklists.find(x => x.id === id);
  if (!c) { renderList(); return; }

  const todosItens = [...ITENS_BASE, ...ITENS_CDE, ...ITENS_EXTRA];
  const nok = Object.values(c.itens||{}).filter(v=>v==='nok').length;
  const status = nok > 0
    ? `<span class="badge badge-nok">⚠️ ${nok} item(s) NOK</span>`
    : `<span class="badge badge-ok">✅ Todos OK</span>`;

  const itemsHtml = todosItens.map(item => {
    const v = (c.itens||{})[item.id];
    if (!v) return '';
    const lbl = v==='ok'  ? '<span class="vi-ok">✓ OK</span>'
               : v==='nok' ? '<span class="vi-nok">✗ NOK</span>'
               : '<span class="vi-na">— N/A</span>';
    return `<div class="view-item"><span class="vi-name">${item.label}</span>${lbl}</div>`;
  }).join('');

  const fuel = c.combustivel ? Math.round(parseInt(c.combustivel)/8*100)+'%' : '—';

  render(`
    <div class="header">
      <div class="logo">📋</div>
      <div><h1>${esc(c.placa||'—')} — Cat. ${esc(c.categoria||'—')}</h1>
           <p>${esc(fmtDate(c.data||c.createdAt||''))} · ${esc(c.cidadeOrigem||'—')} → ${esc(c.cidadeDestino||'—')}</p></div>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      ${status}
      <span style="font-size:12px;color:var(--ink-soft);">Registrado por ${esc(c.responsavel||'—')}</span>
      <button class="btn btn-danger" style="margin-left:auto;font-size:12px;padding:5px 12px;" onclick="deleteChecklist('${c.id}')">🗑 Excluir</button>
    </div>

    <div class="card">
      <div class="card-title">📍 Informações</div>
      <div class="grid2">
        <div><span style="font-size:12px;color:var(--ink-soft);">Placa</span><div style="font-weight:700;">${esc(c.placa||'—')}</div></div>
        <div><span style="font-size:12px;color:var(--ink-soft);">N° Operação</span><div style="font-weight:700;">${esc(c.op||'—')}</div></div>
        <div><span style="font-size:12px;color:var(--ink-soft);">Motorista</span><div>${esc(c.motorista||'—')}</div></div>
        <div><span style="font-size:12px;color:var(--ink-soft);">Motivo</span><div>${esc(c.motivo||'—')}</div></div>
        <div><span style="font-size:12px;color:var(--ink-soft);">Combustível</span><div>${fuel}</div></div>
        <div><span style="font-size:12px;color:var(--ink-soft);">Data</span><div>${esc(fmtDate(c.data||c.createdAt||''))}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">✅ Checklist</div>
      ${itemsHtml || '<p style="color:var(--ink-soft);font-size:13px;">Nenhum item registrado.</p>'}
    </div>

    ${c.obs ? `<div class="card"><div class="card-title">📝 Observações</div><p style="font-size:13.5px;line-height:1.6;">${esc(c.obs)}</p></div>` : ''}

    ${c.assinatura ? `<div class="card"><div class="card-title">✍️ Assinatura</div>
      <img src="${c.assinatura}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);">
      <p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Assinado por: ${esc(c.responsavel||'—')}</p>
    </div>` : ''}

    <button class="btn btn-ghost btn-full" onclick="renderList()">← Voltar à lista</button>
    <div style="height:20px;"></div>
  `);
}

async function deleteChecklist(id) {
  if (!confirm('Excluir este checklist permanentemente?')) return;
  try {
    await db.collection('checklists').doc(id).delete();
    toast('🗑 Checklist excluído.');
    checklists = checklists.filter(c => c.id !== id);
    renderList();
  } catch(e) { toast('❌ Erro: ' + e.message); }
}

/* ── HELPERS ─────────────────────────────────────────────────────── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(s) {
  if (!s) return '—';
  if (s.includes('-') && s.length >= 10) {
    const [y,m,d] = s.slice(0,10).split('-');
    return `${d}/${m}/${y}`;
  }
  return s;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove('show'), 2800);
}

window.__showNew = showNew;
window.viewChecklist = viewChecklist;
window.deleteChecklist = deleteChecklist;
window.salvarChecklist = salvarChecklist;
window.updateCDEItems = updateCDEItems;
window.setFuel = setFuel;
window.clearSig = clearSig;
window.renderList = renderList;

init();
</script>
